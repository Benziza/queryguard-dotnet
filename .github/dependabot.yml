version: 2

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "type:chore"
      - "dependencies"
    groups:
      # Test tooling churns often and carries no consumer risk when grouped.
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
          - "Testcontainers.*"
        update-types:
          - minor
          - patch
      # EF Core and the extension abstractions are the product's public contract.
      # They are reviewed individually rather than grouped.
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
        update-types:
          - patch
    ignore:
      # Major EF Core upgrades change the supported target framework matrix and
      # require an ADR, not a dependency bump.
      - dependency-name: "Microsoft.EntityFrameworkCore.*"
        update-types:
          - version-update:semver-major
      # The Microsoft.Extensions.* versions are pinned per target framework on purpose: a net8.0
      # consumer resolves the 8.x line so QueryGuard does not raise their floor to a 10.x package.
      # A major bump here rewrites the net8.0 pin to 10.x, which is a supported-framework decision
      # and belongs in an ADR rather than a dependency PR.
      - dependency-name: "Microsoft.Extensions.*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "type:chore"
      - "dependencies"
    groups:
      # init and analyze share configuration and must use the same action version.
      codeql:
        patterns:
          - "github/codeql-action/*"
