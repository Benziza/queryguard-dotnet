name: CI

# Third-party actions are pinned to a full commit SHA and updated by Dependabot.
# See docs/decisions/0012-trusted-publishing.md for the release-side hardening.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore QueryGuard.slnx

      - name: Verify formatting
        run: dotnet format QueryGuard.slnx --verify-no-changes --no-restore

  build:
    name: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore QueryGuard.slnx

      # TreatWarningsAsErrors is enabled repository-wide, so a warning fails here.
      - name: Build
        run: dotnet build QueryGuard.slnx -c Release --no-restore

  unit-tests:
    name: unit-tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore QueryGuard.slnx

      - name: Build
        run: dotnet build QueryGuard.slnx -c Release --no-restore

      - name: Run core unit tests
        run: >-
          dotnet test tests/QueryGuard.Core.Tests/QueryGuard.Core.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=core-unit-tests.trx"
          --results-directory artifacts/test-results

      - name: Run testing-API unit tests
        run: >-
          dotnet test tests/QueryGuard.Testing.Tests/QueryGuard.Testing.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=testing-unit-tests.trx"
          --results-directory artifacts/test-results

      - name: Run reporting unit tests
        run: >-
          dotnet test tests/QueryGuard.Reporting.Tests/QueryGuard.Reporting.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=reporting-unit-tests.trx"
          --results-directory artifacts/test-results

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unit-tests-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: warn

  integration-tests:
    name: integration-tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore QueryGuard.slnx

      - name: Build
        run: dotnet build QueryGuard.slnx -c Release --no-restore

      # Real relational command execution against SQLite. A fake interceptor would prove
      # nothing about which methods EF Core actually calls.
      - name: Run EF Core integration tests
        run: >-
          dotnet test tests/QueryGuard.EntityFrameworkCore.Tests/QueryGuard.EntityFrameworkCore.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=efcore-integration-tests.trx"
          --results-directory artifacts/test-results

      - name: Run ASP.NET Core integration tests
        run: >-
          dotnet test tests/QueryGuard.AspNetCore.Tests/QueryGuard.AspNetCore.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=aspnetcore-integration-tests.trx"
          --results-directory artifacts/test-results

      # The README quotes this demo. If it stops demonstrating, the README is wrong.
      - name: Run the sample demonstration
        run: >-
          dotnet test samples/QueryGuard.SampleTests/QueryGuard.SampleTests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=sample-demo-tests.trx"
          --results-directory artifacts/test-results

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: integration-tests-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: warn

  # PostgreSQL and SQL Server, so an assumption baked into SQLite's SQL cannot pass as a general
  # rule. Adding SQL Server here found a shipped bug on its first run: EF Core prefixes its insert
  # batch with SET statements, so classification read the leading keyword, saw SET, and counted every
  # write against read budgets. Ubuntu only - this needs a Docker daemon, and the Windows runners do
  # not offer a Linux one.
  provider-tests:
    name: provider-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore QueryGuard.slnx

      - name: Build
        run: dotnet build QueryGuard.slnx -c Release --no-restore

      # The suite skips its PostgreSQL tests when no daemon answers, so this proves the daemon is
      # there rather than letting the job pass green on a silent skip.
      - name: Confirm Docker is available
        run: docker version

      - name: Run provider tests
        run: >-
          dotnet test tests/QueryGuard.ProviderTests/QueryGuard.ProviderTests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=provider-tests.trx"
          --results-directory artifacts/test-results

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: provider-tests
          path: artifacts/test-results
          if-no-files-found: warn

  # A smoke run, not a measurement. `--job Dry` executes every benchmark once, which proves the
  # harness still compiles and runs; it says nothing about timing. A benchmark job that gated a pull
  # request would be either too slow to be useful or too short to be accurate, and CI runners are
  # shared hardware. Published numbers come from a quiet machine and disclose it — see
  # docs/benchmarks.md.
  benchmark-smoke:
    name: benchmark-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Run every benchmark once
        run: >-
          dotnet run -c Release --project benchmarks/QueryGuard.Benchmarks
          -- --filter "*" --job Dry --artifacts artifacts/benchmarks

      # Raw CSV, JSON, HTML and the full BenchmarkDotNet header, kept alongside the run that produced
      # them. A summary table without its raw output is a number nobody can check.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-artifacts
          path: artifacts/benchmarks
          if-no-files-found: warn

  package-validate:
    name: package-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore QueryGuard.slnx

      - name: Build
        run: dotnet build QueryGuard.slnx -c Release --no-restore

      # The src projects explicitly, not the solution: packing the solution also walks the samples,
      # which are deliberately not packable and produce a warning saying so on every run.
      - name: Pack
        run: |
          for project in src/*/*.csproj; do
            dotnet pack "$project" -c Release --no-build -o artifacts/packages
          done

      # Assertions, not a printed listing a human is trusted to read. A NuGet version cannot be
      # replaced once published, only unlisted, so wrong metadata is permanent. The script ends by
      # installing the packages into a throwaway project from a local feed and running code against
      # them, which is the only check that proves they work as packages.
      - name: Verify packages
        run: eng/verify-packages.sh artifacts/packages

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
