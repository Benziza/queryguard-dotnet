name: Docs

# Third-party actions are pinned to a full commit SHA and updated by Dependabot.
#
# The site is built on every pull request that touches it and deployed only from main. A broken link
# should fail the pull request that introduced it, not the deployment after it merged: docfx exits
# with a warning rather than an error for a dead link, so the build below promotes warnings to errors.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/docs.yml'
  # Deliberately unfiltered, unlike the push trigger. This is a required check, and a required check
  # that is skipped by a path filter never reports: it leaves every pull request touching nothing else
  # waiting for a status that will not arrive. A minute of build time is the cheaper problem.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The site shows a last-modified date and an "Edit this page" link per file, both of which
          # come from git history. A shallow clone leaves them wrong rather than absent.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore QueryGuard.slnx

      - name: Build site
        run: dotnet docfx docs/docfx.json --warningsAsErrors

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_site

  deploy:
    name: deploy site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
